plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Import statements must come AFTER the plugins block
import java.util.Properties
import java.io.FileInputStream

// This part reads your local.properties file
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace 'com.example.sp_v1'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.sp_v1"
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // This line passes the API key to the manifest
        manifestPlaceholders = [MAPS_API_KEY: localProperties.getProperty('MAPS_API_KEY')]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.2.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.google.android.libraries.places:places:3.4.0'

    // --- UPDATED FIREBASE DEPENDENCIES ---

    // ADDED: Firebase BoM - This will manage all the Firebase library versions for you.
    implementation platform('com.google.firebase:firebase-bom:33.0.0')

    // NOTICE: Versions are now removed from the lines below because the BoM handles them.
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'

    // ADDED: The missing Firebase Storage library.
    implementation 'com.google.firebase:firebase-storage'

    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // --- ADDED FOR IMAGE LOADING (GLIDE) ---
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
    // --- END OF ADDED DEPENDENCIES ---

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}